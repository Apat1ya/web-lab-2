<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кошик</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="js/cart.js" defer></script>
</head>
<body>
<header class="header">
    <a class="logo" href="index.html">BookStore</a>
    <nav>
        <a href="about.html">Про магазин</a>
        <a href="catalog.html">Каталог</a>
        <a href="account.html">Особистий кабінет</a>
        <a href="cart.html">Кошик</a>
    </nav>
    <button class="theme-button" type="button">🌙</button>
</header>

<main class="cart-container">
    <table class="cart-table">
        <thead>
        <tr>
            <th>Книга</th>
            <th>Ціна</th>
            <th>К-сть</th>
            <th>Видалити</th>
        </tr>
        </thead>
        <tbody id="cart-items"></tbody>
    </table>

    <section class="summary-cart">
        <h2>Оформлення замовлення</h2>
        <input type="text" class="promo-input" id="promo-code" placeholder="Промокод">
        <button class="promo-button" id="apply-promo" type="button">Застосувати</button>
        <p id="cart-subtotal">Всього: 0 грн</p>
        <p id="cart-discount">Знижка: 0 грн</p>
        <div class="summary-total" id="cart-total">До сплати 0 грн</div>
        <button class="checkout-button" id="checkout-button" type="button">Підтвердити замовлення</button>
    </section>
</main>
</body>
</html>
