<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <script src="js/cart.js" defer></script>
</head>
<body>
<div data-header></div>
<main class="cart-container">
    <table class="cart-table">
        <thead>
        <tr>
            <th>Книга</th>
            <th>Ціна</th>
            <th>К-сть</th>
            <th>Видалити</th>
        </tr>
        </thead>
        <tbody id="cart-items"></tbody>
    </table>

    <section class="summary-cart">
        <h2>Оформлення замовлення</h2>
        <input type="text" class="promo-input" id="promo-code" placeholder="Промокод">
        <button class="promo-button" id="apply-promo" type="button">Застосувати</button>
        <p id="cart-subtotal">Всього: 0 грн</p>
        <p id="cart-discount">Знижка: 0 грн</p>
        <div class="summary-total" id="cart-total">До сплати 0 грн</div>
        <button class="checkout-button" id="checkout-button" type="button">Підтвердити замовлення</button>
    </section>
</main>
</body>
</html>
