<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="js/home.js" defer></script>
</head>
<body>
<div data-header></div>
<main>
    <section class="parallax">
        <div class="layer bg"></div>
        <div class="banner-frame">
            <div class="banner-text">
                <h1>BookStore</h1>
                <p>Відкрий сторінки нових історій</p>
                <a href="catalog.html" class="btn">Каталог</a>
            </div>
            <div class="book-icons">
                <img class="book1" src="assets/book1.png" alt="">
                <img class="book2" src="assets/book2.png" alt="">
                <img class="book3" src="assets/book3.png" alt="">
                <img class="book4" src="assets/book4.png" alt="">
            </div>
        </div>
    </section>

    <section class="catalog-page">
        <div class="section-heading">
            <h2>Популярні книги</h2>
            <p id="home-status" aria-live="polite">Завантаження книг...</p>
        </div>
        <div class="book-list" id="home-books"></div>
    </section>
</main>
</body>
</html>
