<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>BookStore</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="js/home.js" defer></script>
</head>
<body>
<header class="header">
    <a class="logo" href="index.html">BookStore</a>
    <nav>
        <a href="about.html">Про магазин</a>
        <a href="catalog.html">Каталог</a>
        <a href="account.html">Особистий кабінет</a>
        <a href="cart.html">Кошик</a>
    </nav>
    <button class="theme-button" type="button">🌙</button>
</header>

<main>
    <section class="parallax">
        <div class="layer bg"></div>
        <div class="banner-frame">
            <div class="banner-text">
                <h1>BookStore</h1>
                <p>Відкрий сторінки нових історій</p>
                <a href="catalog.html" class="btn">Каталог</a>
            </div>
            <div class="book-icons">
                <img class="book1" src="assets/book1.png" alt="">
                <img class="book2" src="assets/book2.png" alt="">
                <img class="book3" src="assets/book3.png" alt="">
                <img class="book4" src="assets/book4.png" alt="">
            </div>
        </div>
    </section>

    <section class="catalog-page">
        <p id="home-status" class="visually-hidden">Завантаження книг...</p>
        <div class="book-list" id="home-books"></div>
    </section>
</main>
</body>
</html>
