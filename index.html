<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BookStore: каталог книжок із можливістю перегляду та додавання товарів у кошик.">
    <title>BookStore</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="js/home.js" defer></script>
</head>
<body>
<div data-header></div>
<main>
    <section class="parallax">
        <div class="layer bg"></div>
        <div class="banner-frame">
            <div class="banner-text">
                <h1>BookStore</h1>
                <p>Відкрий сторінки нових історій</p>
                <a href="catalog.html" class="btn">Каталог</a>
            </div>
            <div class="book-icons">
                <img class="book1" src="assets/decor/book1.webp" width="180" height="186" decoding="async" fetchpriority="low" alt="">
                <img class="book2" src="assets/decor/book2.webp" width="180" height="143" decoding="async" fetchpriority="low" alt="">
                <img class="book3" src="assets/decor/book3.webp" width="264" height="209" decoding="async" fetchpriority="low" alt="">
                <img class="book4" src="assets/decor/book4.webp" width="336" height="212" decoding="async" fetchpriority="low" alt="">
            </div>
        </div>
    </section>

    <section class="catalog-page">
        <p id="home-status" class="visually-hidden">Завантаження книг...</p>
        <div class="book-list" id="home-books"></div>
    </section>
</main>
</body>
</html>
