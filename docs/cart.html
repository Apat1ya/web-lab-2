<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Кошик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a class="logo" href="index.html">📚 BookStore</a>
     <nav>
        <a href="about.html">Про магазин</a><br>
        <a href="catalog.html">Каталог</a><br>
        <a href="account.html">Особистий кабінет</a><br>
        <a href="cart.html">Кошик</a>
    </nav>
    <button class="theme-button">🌙</button>
</header>


<div class="cart-container">
    <table class="cart-table">
  <thead>
        <tr>
            <th>Книга</th>
            <th>Ціна</th>
            <th>К-ть</th>
            <th>Видалити</th>
        </tr>
    </thead>

  <tbody>
     <tr>
            <td class="book-info">
                <img src="https://content2.rozetka.com.ua/goods/images/big/511797154.png" alt="book">
                <div>
                    <p>Книга Киця на ім’я Пушин</p>
                    <p>Pusheen. Автор — Клер Белтон</p>
                </div>
            </td>

            <td>300 грн</td>
            <td>1</td>
            <td>
                <button class="delete-button">×</button>
            </td>
        </tr>
  </tbody>
</table>
<div class="summary-cart">
  <h2>Оформлення замовлення</h2>

    <input
        type="text"
        class="promo-input"
        placeholder="Промокод"
    >

    <button class="promo-button">Застосувати</button>

    <p>Всього: 300 грн</p>
    <p>Знижка: 0</p>

    <div class="summary-total">
        До сплати 300 грн
    </div>

    <a href="success.html" class="checkout-button">Підтвердити замовлення</a>
</div>
</div>

</body>
</html>
</body>
