<h1>Особистий кабінет</h1>

<div class="auth-tabs">
      <button class="tab active" data-target="login">Вхід</button>
      <button class="tab" data-target="register">Реєстрація</button>
    </div>

<div class="forms">
  <form id="login" class="form active">
  <h2>Вхід</h2>
  <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Пароль" required>

        <button type="submit">ввійти</button>
        </form>

        <form id="register" class="form">
        <h2>Реєстрація</h2>

        <input type="text" placeholder="Ім'я" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Пароль" required>
        <input type="password" placeholder="Повтор пароля" required>

        <button type="submit">створити аккаунт</button>
      </form>
</div>
